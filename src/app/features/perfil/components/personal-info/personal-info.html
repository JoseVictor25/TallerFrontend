<div class="personal-info">
  <div class="photo-section">
    <app-profile-picture [photoUrl]="profile?.url_img_perfil ?? null" [username]="profile?.username || ''" (click)="photoClick.emit()"></app-profile-picture>
  </div>
  <div class="form-content">
    <div class="fields">
      <div class="field-group">
        <label>Nombre de usuario</label>
        <app-input-field
          [(ngModel)]="editData.username"
          icon="fa-user"
          [required]="true"
          [maxLength]="100"
          [minLength]="3"
        ></app-input-field>
      </div>
      <div class="field-group">
        <label>Nombre</label>
        <app-input-field
          [(ngModel)]="editData.nombre"
          icon="fa-user"
          [maxLength]="100"
        ></app-input-field>
      </div>
      <div class="field-group">
        <label>Apellido paterno</label>
        <app-input-field
          [(ngModel)]="editData.apellido_p"
          icon="fa-user"
          [maxLength]="100"
        ></app-input-field>
      </div>
      <div class="field-group">
        <label>Apellido materno</label>
        <app-input-field
          [(ngModel)]="editData.apellido_m"
          icon="fa-user"
          [maxLength]="100"
        ></app-input-field>
      </div>
      <div class="field-group">
        <label>CI</label>
        <app-input-field
          [(ngModel)]="editData.ci"
          icon="fa-id-card"
          [maxLength]="10"
          inputMode="numeric"
        ></app-input-field>
      </div>
      <div class="field-group">
        <label>Complemento</label>
        <app-input-field
          [(ngModel)]="editData.complemento"
          icon="fa-id-card"
          [maxLength]="2"
        ></app-input-field>
      </div>
      <div class="field-group">
        <label>Teléfono</label>
        <app-input-field
          [(ngModel)]="editData.telefono"
          icon="fa-phone"
          [maxLength]="15"
          inputMode="numeric"
        ></app-input-field>
      </div>
      <div class="field-group">
        <label>Dirección</label>
        <app-input-field
          [(ngModel)]="editData.direccion"
          icon="fa-home"
          [maxLength]="255"
        ></app-input-field>
      </div>
    </div>
    <div class="actions">
      <app-button (click)="onSave()" [loading]="isLoading">Guardar cambios</app-button>
    </div>
  </div>
</div>
